<!DOCTYPE html>
<html>
<head>
    <!-- 1. Instant HTML meta redirect -->
    <meta http-equiv="refresh" content="0; url=/trip-split/">
    <title>Redirecting...</title>
</head>
<body>
    <!-- 2. JavaScript fallback redirect if HTML fails -->
    <script>
        window.location.href = "/trip-split/";
    </script>
    <p>If you are not redirected automatically, follow this <a href="/trip-split/">link to Trip Split</a>.</p>
</body>
</html>
